name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast gate: a lint error fails in about a minute, before the full suite starts.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries and Tesseract
        run: >-
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
          tesseract-ocr tesseract-ocr-tur
      - run: pip install -e ".[dev,rapidocr]"
      - name: OCR models (downloaded and checksum-verified)
        run: evrakci ocr-modelleri-indir
      - run: pytest -q -n auto
      - name: Shortcut audit (registry rules, tests per key, page-specific notes)
        run: python .claude/skills/shortcut-audit/audit_shortcuts.py --check
      - name: Shortcut contract (docs/ui-goal/shortcut-contract.tsv matches the registry)
        run: python .claude/skills/shortcut-audit/audit_shortcuts.py --contract docs/ui-goal/shortcut-contract.tsv
      - name: Action paths (every action reachable by mouse, docs/ui-goal/action-paths.tsv is current)
        run: python .claude/skills/shortcut-audit/audit_shortcuts.py --paths --check
      - name: UI measure (rules in docs/ui-goal/rules.json; fails only for rules marked enforced)
        run: python tools/ui_measure.py --out ui-measure.tsv --enforce --crops ui-crops
      - name: Upload the UI measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-measure
          path: |
            ui-measure.tsv
            ui-crops/
          if-no-files-found: ignore
