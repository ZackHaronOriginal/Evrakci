name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries and Tesseract
        run: >-
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
          tesseract-ocr tesseract-ocr-tur
      - run: pip install -e ".[dev,rapidocr]"
      - name: OCR models (downloaded and checksum-verified)
        run: evrakci ocr-modelleri-indir
      - run: ruff check .
      - run: pytest -q
