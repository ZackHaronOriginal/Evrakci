name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "claude/intelligent-fermi-6e3g7l"]
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Evrakçı and cx_Freeze
        run: pip install -e ".[dev]" "cx_Freeze>=8" "pefile>=2023"

      - name: Install Tesseract and Inno Setup (build machine only)
        run: |
          choco install tesseract --version 5.5.3.20260724 -y --no-progress
          choco install innosetup -y --no-progress

      - name: Turkish data for the test run (verified)
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata"
          $dest = "C:\Program Files\Tesseract-OCR\tessdata\tur.traineddata"
          Invoke-WebRequest $url -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "7393381111e1152420fc4092cb44eef4237580d21b92bf30d7d221aad192c6b7") {
            throw "tur_fast checksum mismatch: $hash"
          }

      - name: Tests
        shell: bash
        env:
          # Tests must not write into the real C:\ProgramData ("runner" is only allowed per step).
          EVRAKCI_ASCII_KOK: ${{ runner.temp }}\ascii-kok
        run: |
          export PATH="/c/Program Files/Tesseract-OCR:$PATH"
          ruff check .
          pytest -q

      - name: Stage Tesseract (tesseract.exe, the DLLs it loads, configs, licence docs)
        run: python packaging/stage_tesseract.py "C:\Program Files\Tesseract-OCR" packaging/tesseract-bundle

      - name: Download and verify tur_best
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/tur.traineddata"
          Invoke-WebRequest $url -OutFile tur.traineddata
          $hash = (Get-FileHash tur.traineddata -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "e0c3338dc17503dc7d335a507c9ae01b2b46cfd07561171e1e1ac55d85e8e438") {
            throw "tur_best checksum mismatch: $hash"
          }

      - name: Freeze (folder build)
        run: python packaging/build.py --tesseract packaging/tesseract-bundle --tur-best tur.traineddata

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $env:EVRAKCI_TESSERACT = ""
          python packaging/smoke_test.py --komut build\evrakci\evrakci.exe --klasor "$env:RUNNER_TEMP\duman"

      - name: Smoke test from a Turkish-named folder with a Turkish-named temp folder
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\Şükrü Uygulama"
          Copy-Item build\evrakci $app -Recurse
          $env:TEMP = "$env:RUNNER_TEMP\Geçici Ğ"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $env:EVRAKCI_ASCII_KOK = ""
          python packaging/smoke_test.py --komut "$app\evrakci.exe" --klasor "$env:RUNNER_TEMP\duman-tr"

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import evrakci; print(evrakci.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\evrakci.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Evrakci-Kurulum
          path: dist/*.exe
          if-no-files-found: error
