<!doctype html>
<html lang="tr" data-theme="light" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1366">
<title>Değerler · Evrakçı mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<style>
/* ---- Değerler only (tokens only, no new colours, no new radii) ----
 * Pattern: Split Pane (8) = values table | page crop. States: main (kontrol gerekenler, F2 edit,
 * undo toast), empty, all (Tümünü incele), ornek (spot-check sample before export).
 * Two separate markers per row: İnceleme (human: circle-check İncelendi / circle-dashed
 * İncelenmedi, the Kontrol tab glyphs) and Güven (machine: Emin / Orta / Kontrol / Okunamadı). */
.window { --inspector-w: 384px; }
[data-text="130"] .window, [data-text="150"] .window { --inspector-w: 432px; }
.work { position: relative; }

/* Work-area title (panel 20/28) + template scope */
.vhead { height: 56px; flex: none; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-6) 0; }
.vhead .spacer { flex: 1; }
.vhead .select { min-width: 0; white-space: nowrap; }
.filterbar { min-height: 48px; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-6); }
.filterbar > :not(.spacer) { flex-shrink: 0; }
.filterbar .spacer { flex: 1; }
.input.search { width: calc(208px * var(--text-scale)); }
.input.search .placeholder { white-space: nowrap; }
.input.search.is-off, .input.search.is-off .placeholder { color: var(--text-disabled); border-color: var(--hairline); }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: var(--r-control); overflow: hidden; background: var(--bg-input); }
.seg .btn { border: 0; border-radius: 0; height: calc(var(--control-h) - 2px); padding-right: var(--sp-2); }
.seg .btn + .btn { box-shadow: inset 1px 0 0 var(--hairline); }
.seg .btn[aria-pressed="true"] { background: var(--bg-selected); box-shadow: inset 0 0 0 2px var(--accent-edge-selected); }
.seg .btn:disabled .badge { color: var(--text-2); }

/* Values table: L1 frame with hairlines, sticky header, rows 40 px */
.tablewrap {
  flex: 1; min-height: 0; margin: 0 var(--sp-6);
  overflow: auto; scrollbar-width: thin;
  background: var(--bg-layer); border: 1px solid var(--hairline); border-radius: var(--r-control);
}
.vt { table-layout: fixed; min-width: 100%; width: auto; border: 0; border-radius: 0; background: transparent; }
.vt th { position: sticky; top: 0; z-index: 2; background: var(--bg-layer); border-bottom: 0; box-shadow: inset 0 -1px 0 var(--edge); white-space: nowrap; }
.vt th .th { display: inline-flex; align-items: center; gap: var(--sp-1); }
.vt th .th .i { color: var(--icon-2); }
.vt th.sorted { color: var(--text); }
.vt td { white-space: nowrap; position: relative; font-feature-settings: var(--font-features-code); }
.vt td.rev { padding: 0; text-align: center; }
.vt td.rev .i { width: var(--icon-sm); height: var(--icon-sm); color: var(--text-2); vertical-align: middle; }
.vt td.rev .i.done { color: var(--ok); }
.vt th.rev { padding: 0; text-align: center; }
.v { display: inline-flex; align-items: center; gap: var(--sp-2); }
.v.check .i { color: var(--check-text); }
.v.bad, .v.bad .i { color: var(--danger); font-weight: var(--fw-semibold); }
.more { margin-left: var(--sp-2); font-size: var(--fs-secondary); color: var(--text-2); }
.elle { margin-left: var(--sp-2); }

/* Uncertain character: wash + 2px underline, text stays full contrast (icon + word sit in the row) */
mark.u {
  background: var(--check-wash); color: inherit; font-weight: var(--fw-semibold);
  box-shadow: inset 0 -2px 0 var(--rider-edge); border-radius: var(--r-sheet); padding: 0 1px;
}

/* F2: the cell turns into an input in the same box (no layout shift) */
.edit {
  position: absolute; inset: var(--sp-1);
  display: flex; align-items: center; padding: 0 var(--sp-2);
  background: var(--bg-input); border: 1px solid var(--accent); border-radius: var(--r-control);
}
.edit .caret { width: 1px; height: 20px; margin-left: 1px; background: var(--text); }
.edit .tooltip { top: calc(100% + var(--sp-2)); left: 0; }

/* Key hints under the table */
.hintbar { height: 40px; flex: none; display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-6); }
.hintbar .spacer { flex: 1; }
.hint { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-secondary); line-height: var(--lh-secondary); color: var(--text-2); white-space: nowrap; }
.statusbar .bad, .statusbar .bad .i { color: var(--danger); font-weight: var(--fw-medium); }

/* Page crop pane */
.insp-head { padding: var(--sp-4) var(--sp-4) var(--sp-3); border-bottom: 1px solid var(--hairline); }
.insp-title { display: flex; align-items: center; justify-content: space-between; min-height: var(--control-h); }
.cropsec { padding: var(--sp-4); }
.crop {
  position: relative; height: 168px; overflow: hidden;
  background: var(--bg-paper); color: var(--manila-ink);
  border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet);
}
.crop .ink-line { position: absolute; left: var(--sp-4); height: 6px; background: var(--paper-ink-strong); }
.crop .ink-line.a { top: 12px; width: 144px; }
.crop .ink-line.b { top: 148px; width: 264px; background: var(--paper-ink); }
.ink-row { position: absolute; left: var(--sp-4); right: var(--sp-4); display: flex; align-items: baseline; gap: var(--sp-4); font-size: calc(var(--fs-body) / var(--text-scale)); line-height: 28px; } /* page image: fixed size */
.ink-row .lbl { width: 72px; flex: none; }
.ink-row.r1 { top: 28px; } .ink-row.r2 { top: 68px; } .ink-row.r3 { top: 112px; }
.ink-row .mono { font-family: var(--font-mono); font-size: calc(var(--fs-panel) / var(--text-scale)); }
.uc { outline: 2px solid var(--rider-edge); outline-offset: 1px; border-radius: var(--r-sheet); }
.spot { position: absolute; border: 2px solid var(--manila-ink); border-radius: var(--r-sheet); box-shadow: 0 0 0 400px var(--scrim); }
.crop-cap { display: flex; align-items: center; justify-content: space-between; margin-top: var(--sp-2); }
.crop.blank { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); background: transparent; box-shadow: none; border: 1px dashed var(--edge); color: var(--text-2); }
.crop.blank .i.lg { color: var(--icon-2); stroke-width: 1.5; }
.vals { grid-template-columns: 64px 1fr; row-gap: var(--sp-2); align-items: baseline; }
.vals dd.mono { font-family: var(--font-mono); font-size: var(--fs-panel); line-height: var(--lh-panel); }
.chg { color: var(--text-accent); font-weight: var(--fw-semibold); box-shadow: inset 0 -2px 0 var(--accent); border-radius: var(--r-sheet); padding: 0 1px; }
.note { margin: var(--sp-2) 0 0; }
.stack-actions { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-4); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }

/* Empty state sits inside the table frame (pattern skeleton stays) */
.emptywrap { display: flex; flex-direction: column; }
.emptywrap .vt { flex: none; }
.emptywrap .empty { padding: var(--sp-12) var(--sp-6); max-width: 608px; }

/* Marker gutter: value columns keep one text edge; the cell icon sits in the gutter */
.vt td.val { padding-left: 36px; }
.vt th.val { padding-left: 36px; }
.vt td.val .v > .i { position: absolute; left: var(--sp-3); top: 50%; margin-top: -8px; }
</style>
</head>
<body>

<div class="sheet" id="sheet"></div>

<script>
/* ---------- tiny template helpers (mockup only) ---------- */
const ic = (n, c = "") => `<svg class="i ${c}"><use href="#${n}"/></svg>`;
const kbd = k => `<span class="kbd">${k}</span>`;
const TABS = ["Yükle", "Kontrol", "Şablonlar", "Değerler", "Dışa Aktar", "Rehber"];
const MENU = '<span class="menu-item"><u>D</u>osya</span><span class="menu-item">Düz<u>e</u>n</span><span class="menu-item"><u>G</u>örünüm</span><span class="menu-item">Gi<u>t</u></span><span class="menu-item"><u>A</u>raçlar</span><span class="menu-item"><u>Y</u>ardım</span>';
const JOB = "Kasım 2026 kapasite raporları";

/* one vocabulary on every tab (README "Durum sözlüğü") */
const CONF = {
  emin: p => `<span class="status ok">${ic("signal-high")}Emin <span class="pct">%${p}</span></span>`,
  orta: p => `<span class="status mid">${ic("signal-medium")}Orta <span class="pct">%${p}</span></span>`,
  kontrol: p => `<span class="status check">${ic("triangle-alert")}Kontrol <span class="pct">%${p}</span></span>`,
  bad: () => `<span class="status bad">${ic("circle-x")}Okunamadı</span>`,
};
const REV = d => d ? `<svg class="i done" aria-label="İncelendi"><use href="#circle-check"/></svg>`
                   : `<svg class="i" aria-label="İncelenmedi"><use href="#circle-dashed"/></svg>`;
const K = v => `<span class="v check" aria-label="Kontrol: emin değil">${ic("triangle-alert", "sm")}<span>${v}</span></span>`;
const BAD = `<span class="v bad">${ic("circle-x", "sm")}<span>Okunamadı</span></span>`;
const u = c => `<mark class="u">${c}</mark>`;

function win(state, label, o) {
  return `<div class="window" data-state="${state}" aria-label="${label}">
  <header class="titlebar">
    <img class="app-icon" src="../../logo/kit/evrakci-app-icon-16.svg" alt="">
    <nav class="menubar" aria-label="Menü çubuğu">${MENU}</nav>
    <div class="title"><b>${JOB}</b> · Evrakçı</div>
    <span class="save-state">${ic("cloud-check", "sm")}Kaydedildi 14:32</span>
    <div class="caption-buttons" aria-hidden="true"><span>${ic("minus")}</span><span>${ic("square")}</span><span>${ic("x")}</span></div>
  </header>
  <nav class="tabstrip" role="tablist" aria-label="Sekmeler">${TABS.map(t => `<span class="tab" role="tab" aria-selected="${t === "Değerler"}">${t}</span>`).join("")}</nav>
  <div class="commandbar" role="toolbar" aria-label="Değerler komutları">${o.cmd}</div>
  <div class="workspace">
    <div class="work">${o.work}</div>
    <div class="splitter" role="separator" aria-orientation="vertical"></div>
    <aside class="inspector" aria-label="Sayfa kesiti ve değer">${o.insp}</aside>
  </div>
  <footer class="statusbar">${o.status}</footer>
  ${o.extra || ""}
</div>`;
}

/* ---------- command bar: no filled primary here; the one primary is "Onayla ve sonrakine geç" ---------- */
const cmd = (o = {}) => {
  const d = o.empty ? "disabled" : "";
  return `
  <button class="btn subtle icon" aria-label="${o.empty ? "Geri al" : "Geri al: 8 değeri onayla (Ctrl+Z)"}" ${d}>${ic("undo-2")}</button>
  <button class="btn subtle icon" aria-label="Yinele (Ctrl+Y)" disabled>${ic("redo-2")}</button>
  <span class="sep"></span>
  <button class="btn subtle">${ic("play")}Değerleri oku</button>
  <button class="btn subtle" ${d}>${ic("scan-text")}Yalnızca eksikleri oku</button>
  <span class="spacer"></span>
  <button class="btn subtle" aria-pressed="${!!o.all}" aria-label="Tümünü incele: emin olanlar dahil her değeri sırayla göster" ${d}>${ic("list-checks")}Tümünü incele</button>
  <button class="btn subtle" aria-pressed="${!!o.sample}" aria-label="Örnek kontrol: emin okunan değerlerden rastgele 20 değer, dışa aktarmadan önce" ${d}>${ic("shuffle")}Örnek kontrol</button>
  <span class="sep"></span>
  <button class="btn subtle" aria-label="Önceki kontrol (Shift+N)" ${d}>${ic("chevron-up")}Önceki</button>
  <button class="btn subtle" aria-label="Sonraki kontrol (N)" ${d}>${o.empty ? ic("triangle-alert") : `<svg class="i" style="color:var(--check-text)"><use href="#triangle-alert"/></svg>`}Sonraki kontrol</button>
  <span class="sep"></span>
  <button class="btn subtle" aria-label="Seçilen ${o.sel || 0} değeri onayla (Ctrl+Enter)" ${o.sel ? "" : "disabled"}>${ic("check")}Seçilenleri onayla (${o.sel || 0})</button>`;
};

const vhead = (title, sub) => `<div class="vhead"><h2 class="t-panel">${title}</h2><span class="t-2 num">${sub}</span><span class="spacer"></span>
  <span class="select" role="combobox" aria-label="Şablon">Şablon: Ekspertiz Raporu${ic("chevron-down")}</span></div>`;

const seg = (on, o = {}) => {
  const b = (key, icon, color, label, n) => `<button class="btn subtle" aria-pressed="${on === key}" ${o.empty ? "disabled" : ""}>${color ? `<svg class="i" style="color:${color}"><use href="#${icon}"/></svg>` : ic(icon)}${label}<span class="badge num">${n}</span></button>`;
  return `<div class="filterbar" role="search" aria-label="Süz ve sırala">
    <span class="input search ${o.empty ? "is-off" : ""}">${ic("search", "sm")}<span class="placeholder">Firma, sicil no…</span><span class="kbd" style="margin-left:auto">Ctrl+F</span></span>
    <span class="seg" role="group" aria-label="Göster">
      ${b("kontrol", "triangle-alert", o.empty ? "" : "var(--check-text)", "Kontrol gerekenler", o.empty ? 0 : 14)}
      ${b("todo", "circle-dashed", "", "İncelenmemiş", o.empty ? 0 : 105)}
      ${o.sample ? b("sample", "shuffle", "", "Örnek", 20) : ""}
      ${b("all", "list-checks", "", "Tümü", o.empty ? 0 : 152)}
    </span>
    <span class="spacer"></span>
    ${o.sample ? `<span class="t-2">Rastgele sıra</span>` : `<span class="select" role="combobox" aria-label="Sırala" style="min-width:0;white-space:nowrap">Sırala: Belge no${ic("chevron-down")}</span>`}
  </div>`;
};

const COLS = `<colgroup><col style="width:calc(40px * var(--text-scale))"><col style="width:calc(64px * var(--text-scale))"><col style="width:calc(80px * var(--text-scale))"><col style="width:calc(208px * var(--text-scale))"><col style="width:calc(144px * var(--text-scale))"><col style="width:calc(120px * var(--text-scale))"><col style="width:calc(136px * var(--text-scale))"><col></colgroup>`;
const HEAD = `<thead><tr><th class="rev" aria-label="İnceleme">${ic("circle-check", "sm")}</th><th class="num sorted" aria-sort="ascending"><span class="th">Belge${ic("arrow-up", "sm")}</span></th><th class="num">Sayfalar</th><th class="val">Firma</th><th class="val">Sicil no</th><th class="val">Rapor tarihi</th><th class="num">Kapasite (ton/yıl)</th><th>Güven</th></tr></thead>`;
const row = (r, sel) => `<tr ${sel ? 'aria-selected="true"' : ""}><td class="rev">${REV(r.rev)}</td><td class="num">${r.b}</td><td class="num">${r.p}</td><td class="val">${r.f}</td><td class="val ${r.edit ? "editcell" : ""}">${r.s}</td><td class="val">${r.t}</td><td class="num">${r.k}</td><td>${r.c}${r.more ? `<span class="more">${r.more}</span>` : ""}</td></tr>`;
const table = (rows, selB) => `<div class="tablewrap" tabindex="0" aria-label="Değerler tablosu. Tab sonraki değer; F6 sonraki bölge"><table class="table vt">${COLS}${HEAD}<tbody>${rows.map(r => row(r, r.b === selB)).join("")}</tbody></table></div>`;

const EDIT = `<div class="edit is-focus" role="textbox" aria-label="Sicil no, düzenleniyor"><span>34-0172-K/8</span><i class="caret"></i><span class="tooltip" role="tooltip">${kbd("Enter")}Onayla, sonraki kontrol${kbd("Esc")}Vazgeç</span></div>`;
const KROWS = [
  { b: 4, p: "13–14", f: "Gediz Tekstil San. A.Ş.", s: "35-0211-G/1", t: "22.09.2026", k: K(`1.25${u("O")}`), c: CONF.kontrol(58) },
  { b: 7, p: "29–30", f: K(`Marmara D${u("o")}k${u("u")}m A.Ş.`), s: "34-1127-D/4", t: "03.10.2026", k: "840", c: CONF.kontrol(64) },
  { b: 10, p: "45–46", f: "Anadolu Pres Makina", s: BAD, t: "08.10.2026", k: "1.640", c: CONF.bad() },
  { b: 13, p: "61–64", f: "Karadeniz Metal Ltd.", s: K(`${u("O")}6-2210-K/1`), t: "19.10.2026", k: "960", c: CONF.kontrol(61) },
  { b: 16, p: "72–73", f: "Ege Kalıp San. Ltd.", s: EDIT, edit: true, t: "05.11.2026", k: "1.250", c: CONF.kontrol(55) },
  { b: 19, p: "82–83", f: `<span class="v">Trakya Boru A.Ş.<span class="status todo elle">${ic("pencil", "sm")}elle</span></span>`, s: "16-0093-T/7", t: K(`1${u("S")}.10.2026`), k: "2.100", c: CONF.kontrol(63) },
  { b: 23, p: "99–100", f: "Akdeniz Soğutma Ltd.", s: "07-0555-S/3", t: "28.10.2026", k: K(`2.1${u("B")}0`), c: CONF.kontrol(60) },
  { b: 27, p: "118–120", f: K(`${u("C")}ukurova Ambalaj A.Ş.`), s: BAD, t: "26.10.2026", k: "780", c: CONF.bad() },
  { b: 31, p: "139–140", f: "Bursa Yan Sanayi A.Ş.", s: "16-0840-B/2", t: K(`${u("O")}4.11.2026`), k: "1.500", c: CONF.kontrol(62) },
  { b: 35, p: "158–159", f: K(`${u("l")}zmir Vana ve Pompa`), s: "35-0932-İ/6", t: "30.10.2026", k: "1.320", c: CONF.kontrol(57) },
  { b: 38, p: "174–175", f: "Konya Dişli Sanayi", s: K(`42-0671-${u("O")}/5`), t: "02.11.2026", k: "1.080", c: CONF.kontrol(59) },
  { b: 41, p: "186–188", f: "Sivas Makina Ltd.", s: "58-0114-M/2", t: "09.11.2026", k: K(`7${u("B")}0`), c: CONF.kontrol(66) },
  { b: 44, p: "205–206", f: "Edirne Un ve Gıda A.Ş.", s: K(`22-0307-${u("Q")}/1`), t: "10.11.2026", k: "1.060", c: CONF.kontrol(54) },
];
const AROWS = [
  { rev: 1, b: 1, p: "1–2", f: "Bornova Kablo San. A.Ş.", s: "35-0107-B/3", t: "01.09.2026", k: "1.480", c: CONF.emin(98) },
  { rev: 1, b: 2, p: "3–4", f: "Gebze Plastik Ltd.", s: "41-0662-G/2", t: "02.09.2026", k: "920", c: CONF.emin(97) },
  { rev: 1, b: 4, p: "13–14", f: "Gediz Tekstil San. A.Ş.", s: "35-0211-G/1", t: "22.09.2026", k: "1.250", c: CONF.emin(99) },
  { rev: 1, b: 5, p: "19–20", f: "Denizli Havlu San. A.Ş.", s: "20-0319-D/6", t: "25.09.2026", k: "1.120", c: CONF.orta(84) },
  { rev: 1, b: 7, p: "29–30", f: "Marmara Döküm A.Ş.", s: "34-1127-D/4", t: "03.10.2026", k: "840", c: CONF.emin(96) },
  { rev: 1, b: 8, p: "35–36", f: "Kayseri Mobilya Ltd.", s: "38-0845-K/1", t: "05.10.2026", k: "710", c: CONF.emin(98) },
  { rev: 0, b: 10, p: "45–46", f: "Anadolu Pres Makina", s: BAD, t: "08.10.2026", k: "1.640", c: CONF.bad() },
  { rev: 1, b: 11, p: "51–52", f: "Samsun Gemi Teçhizat", s: "55-0208-S/4", t: "12.10.2026", k: "1.900", c: CONF.emin(97) },
  { rev: 0, b: 13, p: "61–64", f: "Karadeniz Metal Ltd.", s: K(`${u("O")}6-2210-K/1`), t: "19.10.2026", k: "960", c: CONF.kontrol(61) },
  { rev: 0, b: 14, p: "65–66", f: "Tekirdağ Gıda San. A.Ş.", s: "59-0731-T/2", t: "20.10.2026", k: "1.350", c: CONF.orta(81) },
